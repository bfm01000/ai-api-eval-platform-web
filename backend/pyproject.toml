[project]
name = "api-observatory-backend"
version = "0.1.0"
description = "Backend for reproducible AI API service quality evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jsonschema[format]>=4.23,<5.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_observatory"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
